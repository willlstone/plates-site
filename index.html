<html lang="en">
<head>

<title>Plates</title>
<style>
:root {
  --ink: #0d0e10;
  --chalk: #f2f2ee;
  --dim: #9a9ca3;
  --brand: #c8f135;
  --line: #24262b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--chalk);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
}
main { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
h1 { font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 8px; }
h1.hero { font-size: 56px; color: var(--brand); }
h2 { font-size: 20px; margin: 40px 0 8px; padding-top: 24px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 24px 0 4px; }
p, li { color: #d6d7d2; }
.lead { font-size: 18px; color: var(--chalk); }
.meta, .note, .back { color: var(--dim); font-size: 14px; }
.back { margin: 0 0 24px; }
.note { margin-top: 32px; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
ul { padding-left: 20px; }
.tagline { font-size: 22px; font-weight: 600; color: var(--dim); margin: 0 0 16px; }
.links { list-style: none; padding: 0; display: flex; gap: 24px; font-weight: 600; }

</head>

<main>
